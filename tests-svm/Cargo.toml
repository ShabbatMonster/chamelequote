[package]
name = "chamelequote-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# The harness lives in src/lib.rs so every test file can share it; hence regular dependencies.
[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
base64 = "0.22"
chamelequote = { path = "../programs/chamelequote", features = ["no-entrypoint", "dev"] }
chamelequote-crank = { path = "../crank" }
litesvm = "0.17"
serde_json = "1"
solana-account = "4"
solana-clock = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
# The crank as of the build deployed before the move to DAMM v2 (Raydium pools), for the
# migration test.
crank-raydium = { package = "chamelequote-crank", git = "file:///C:/Users/Evan/Desktop/chamelequote", rev = "9bfee32" }
