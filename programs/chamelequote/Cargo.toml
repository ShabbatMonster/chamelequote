[package]
name = "chamelequote"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
custom-heap = []
custom-panic = []
anchor-debug = []
no-log-ix-name = []
# Test-only instructions. Never deploy a build with this on.
dev = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
uint = { version = "0.10", default-features = false }
